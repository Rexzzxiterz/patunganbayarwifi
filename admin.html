<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white">

<div class="max-w-6xl mx-auto p-6">

    <h1 class="text-4xl font-bold mb-6">
        Dashboard Admin
    </h1>

    <div class="bg-slate-800 rounded-xl p-4 overflow-x-auto">

        <table class="w-full">

            <thead>
                <tr class="border-b border-slate-700">
                    <th class="p-3 text-left">Username</th>
                    <th class="p-3 text-left">ID Akun</th>
                    <th class="p-3 text-left">Wallet</th>
                    <th class="p-3 text-left">Status</th>
                    <th class="p-3 text-left">Aksi</th>
                </tr>
            </thead>

            <tbody id="tableData">

                <tr>
                    <td class="p-3">user123</td>
                    <td class="p-3">998877</td>
                    <td class="p-3">08123456789</td>
                    <td class="p-3 text-yellow-400">
                        Pending
                    </td>
                    <td class="p-3">

                        <button
                        class="bg-green-500 px-3 py-1 rounded"
                        onclick="approve(this)">
                            Approve
                        </button>

                        <button
                        class="bg-blue-500 px-3 py-1 rounded ml-2"
                        onclick="paid(this)">
                            Paid
                        </button>

                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

function approve(btn){

    const row = btn.closest("tr");

    row.children[3].innerHTML =
    '<span class="text-green-400">Approved</span>';

}

function paid(btn){

    const row = btn.closest("tr");

    row.children[3].innerHTML =
    '<span class="text-blue-400">Paid</span>';

}

</script>

</body>
</html>
